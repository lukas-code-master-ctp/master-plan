<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — Tu Masterplan</title>
<link rel="stylesheet" href="/consola.css">
<style>
  body {
    display: grid; place-items: center; align-content: center; gap: 1.75rem;
    min-height: 100vh; padding: 2rem 1rem;
    /* La misma trama de loteo que ocupan los planos sin foto: el fondo dice qué
       es esto sin competir con el formulario. */
    background:
      radial-gradient(ellipse at 50% 35%, rgb(250 250 250 / 0) 0, var(--zinc-50) 70%),
      linear-gradient(var(--zinc-200) 1px, transparent 1px) 0 0 / 28px 28px,
      linear-gradient(90deg, var(--zinc-200) 1px, var(--zinc-50) 1px) 0 0 / 28px 28px;
  }
  .logo { display: grid; justify-items: center; gap: 0.75rem; text-align: center; }
  .logo .marca__hito { width: 3rem; height: 3rem; padding: 0.55rem; border-radius: var(--radio-lg); }
  .logo strong { font: 700 1.375rem/1 var(--sans); letter-spacing: -0.02em; }
  .entrada {
    width: min(24rem, 100%); padding: 1.75rem;
    background: #fff; border: 1px solid var(--zinc-200);
    border-radius: var(--radio-lg); box-shadow: 0 20px 40px -24px rgb(0 0 0 / 0.25), var(--sombra);
  }
  .entrada form { display: grid; gap: 0.875rem; }
  .entrada .campo input { height: 2.75rem; font-size: 0.9375rem; }
  .entrada .boton { width: 100%; height: 2.75rem; margin-top: 0.25rem; font-weight: 600; }
  .entrada .aviso { margin: 0 0 1rem; }
  .pie { margin: 0; font-size: 0.8125rem; color: var(--zinc-500); text-align: center; }
</style>
</head>
<body>
<header class="logo">
  <svg class="marca__hito" viewBox="0 0 32 32" aria-hidden="true">
    <circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="1.6"/>
    <path d="M16 4v6M16 22v6M4 16h6M22 16h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M16 10.5 21.5 16 16 21.5 10.5 16Z" fill="currentColor"/>
  </svg>
  <strong>Tu Masterplan</strong>
</header>
<main class="entrada">
  <!--ERROR-->
  <form method="post" action="/entrar">
    <label class="campo">
      <span>Correo</span>
      <input name="email" type="email" autocomplete="username" autofocus required>
    </label>
    <label class="campo">
      <span>Contraseña</span>
      <input name="clave" type="password" autocomplete="current-password" required>
    </label>
    <button class="boton" type="submit">Iniciar sesión</button>
  </form>
</main>
<p class="pie">¿No tienes cuenta? Escríbenos a <a href="mailto:e.ruiz@compratuparcela.cl?subject=Quiero%20una%20cuenta%20en%20Tu%20Masterplan">e.ruiz@compratuparcela.cl</a></p>
</body>
</html>
