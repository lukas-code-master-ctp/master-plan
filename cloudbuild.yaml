# Construye y despliega la consola de Tu Masterplan en Cloud Run:
#   gcloud builds submit --config=cloudbuild.yaml --project <proyecto>
#
# Los archivos (proyectos subidos, sitios construidos, cachés) viven en un bucket
# montado como volumen: el disco de la instancia se pierde al reiniciar. Las
# cuentas y de quién es cada loteo NO: esos van a Postgres, porque SQLite sobre
# un bucket montado no tiene bloqueo de archivos y se corrompe. Sin
# `MASTERPLAN_BD` la consola se niega a arrancar.
#
# Una vez, antes del primer despliegue:
#   gcloud artifacts repositories create tumasterplan --repository-format=docker \
#     --location=southamerica-east1
#   gcloud storage buckets create gs://tumasterplan-datos --location=southamerica-east1
#   gcloud sql instances create tumasterplan-bd --database-version=POSTGRES_16 \
#     --edition=ENTERPRISE --tier=db-f1-micro --region=southamerica-east1
#   printf '%s' "$(openssl rand -base64 32)" | gcloud secrets create consola-secreto --data-file=-
#   # Cloud SQL por el socket que monta Cloud Run (--add-cloudsql-instances):
#   printf '%s' "postgresql+psycopg://<usuario>:<clave>@/<base>?host=/cloudsql/<proyecto>:southamerica-east1:tumasterplan-bd" \
#     | gcloud secrets create masterplan-bd --data-file=-
#   printf '%s' "<token de vercel>"      | gcloud secrets create vercel-token --data-file=-
#   # Entrar con Google: el secreto del cliente OAuth web (su ID va en _GOOGLE_CLIENT_ID,
#   # que no es secreto). URI de redirección: <_CONSOLA_URL>/entrar/google/vuelta
#   printf '%s' "<secreto del cliente>" | gcloud secrets create google-client-secret --data-file=-
#   # La revisión de Cierra cada 15 minutos: Cloud Scheduler manda esta clave en la
#   # cabecera X-Tarea-Clave de POST <_CONSOLA_URL>/api/tareas/cierra.
#   python3 -c "import secrets,sys; sys.stdout.write(secrets.token_urlsafe(40))" \
#     | gcloud secrets create consola-tareas-clave --data-file=-
#   # Los correos (registro, contraseña, invitaciones y avisos al equipo): la clave de
#   # API de Resend (permiso "Sending access"), con el dominio de EMAIL_FROM
#   # (tumasterplan.cl) verificado allá. Sin este secreto el despliegue falla: créalo antes.
#   printf '%s' "<clave de resend>" | gcloud secrets create resend-api-key --data-file=-
#   # La consola enciende los Cloud Run Jobs de los trabajos con el id como argumento:
#   # su cuenta de servicio necesita ejecutarlos con argumentos propios. Y la cuenta de
#   # Cloud Build necesita desplegar jobs (roles/run.admin, que ya usa para el servicio).
#   gcloud projects add-iam-policy-binding <proyecto> \
#     --member=serviceAccount:<cuenta de servicio de la consola> --role=roles/run.developer
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_IMAGEN}:$BUILD_ID', '-t', '${_IMAGEN}:latest', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', '${_IMAGEN}']

  # Los trabajos (construir, leer un plano, publicar) corren en Cloud Run Jobs, cada uno
  # en su propia máquina, que se paga solo mientras corre (`consola/trabajos_remotos.py`).
  # Se despliegan antes que la consola: la consola nueva ya los lanza.
  # El pesado es lo que antes era la consola entera: una panorámica son 104 megapíxeles,
  # y con 4Gi la máquina moría en silencio al generar los niveles de imagen de un vuelo
  # de 29 fotos; con 8Gi la misma construcción termina. Una construcción es trabajo de
  # CPU: 2 la terminan bien. `--task-timeout` deja margen sobre el tope del propio trabajo
  # (TOPE_PESADO, 45 min), y sin reintentos: el obrero no corre dos veces lo mismo.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - '${_JOB_PESADO}'
      - '--image=${_IMAGEN}:$BUILD_ID'
      - '--region=${_REGION}'
      - '--command=/usr/bin/tini'
      - '--args=--,python,-m,consola.obrero'
      - '--memory=8Gi'
      - '--cpu=2'
      - '--task-timeout=3000'
      - '--max-retries=0'
      - '--add-volume=name=datos,type=cloud-storage,bucket=${_BUCKET}'
      - '--add-volume-mount=volume=datos,mount-path=/datos'
      - '--set-cloudsql-instances=${PROJECT_ID}:${_REGION}:${_INSTANCIA_BD}'
      - '--set-secrets=MASTERPLAN_BD=masterplan-bd:latest,VERCEL_TOKEN=vercel-token:latest'
      - '--set-env-vars=^|^CONSOLA_ENTORNO=produccion|MASTERPLAN_DATOS=/datos|VERCEL_SCOPE=${_VERCEL_SCOPE}|MASTERPLAN_DOMINIO=${_DOMINIO}'

  # Publicar y poner al día el visor solo suben archivos con el CLI de Vercel.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - '${_JOB_LIVIANO}'
      - '--image=${_IMAGEN}:$BUILD_ID'
      - '--region=${_REGION}'
      - '--command=/usr/bin/tini'
      - '--args=--,python,-m,consola.obrero'
      - '--memory=2Gi'
      - '--cpu=1'
      - '--task-timeout=1500'
      - '--max-retries=0'
      - '--add-volume=name=datos,type=cloud-storage,bucket=${_BUCKET}'
      - '--add-volume-mount=volume=datos,mount-path=/datos'
      - '--set-cloudsql-instances=${PROJECT_ID}:${_REGION}:${_INSTANCIA_BD}'
      - '--set-secrets=MASTERPLAN_BD=masterplan-bd:latest,VERCEL_TOKEN=vercel-token:latest'
      - '--set-env-vars=^|^CONSOLA_ENTORNO=produccion|MASTERPLAN_DATOS=/datos|VERCEL_SCOPE=${_VERCEL_SCOPE}|MASTERPLAN_DOMINIO=${_DOMINIO}'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICIO}'
      - '--image=${_IMAGEN}:$BUILD_ID'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'          # la puerta es la contraseña de la consola
      - '--use-http2'                      # sin esto, 32 MiB por petición
      - '--min-instances=0'
      # Una sola instancia: los topes por IP de las rutas públicas viven en memoria.
      # El avance de los trabajos ya no (va en la base), así que esto se puede soltar
      # el día que esos topes también vayan a la base.
      - '--max-instances=1'
      # CPU solo mientras atiende (facturación por petición): sin visitas no cobra.
      # Antes iba con --no-cpu-throttling porque la construcción corría acá, en un hilo
      # de fondo; eso dejaba la instancia cobrando cada segundo que estaba prendida,
      # unos CLP 150.000 al mes. Ahora los trabajos corren en los jobs de arriba.
      - '--cpu-throttling'
      # Sin construcciones adentro no necesita 8Gi, pero sigue recibiendo panorámicas de
      # 60 MB y armando las páginas del plano. Por petición, el tamaño casi no pesa en
      # la cuenta: se paga solo el rato que atiende.
      - '--memory=4Gi'
      - '--cpu=2'
      - '--timeout=1800'                   # subir un vuelo entero por una conexión lenta
      - '--port=8080'
      - '--add-volume=name=datos,type=cloud-storage,bucket=${_BUCKET}'
      - '--add-volume-mount=volume=datos,mount-path=/datos'
      - '--add-cloudsql-instances=${PROJECT_ID}:${_REGION}:${_INSTANCIA_BD}'
      - '--set-secrets=CONSOLA_SECRETO=consola-secreto:latest,MASTERPLAN_BD=masterplan-bd:latest,VERCEL_TOKEN=vercel-token:latest,GOOGLE_CLIENT_SECRET=google-client-secret:latest,CONSOLA_TAREAS_CLAVE=consola-tareas-clave:latest,RESEND_API_KEY=resend-api-key:latest'
      # _DOMINIO vacío deja los loteos en masterplan-<slug>.vercel.app; con
      # tumasterplan.cl pasan a <slug>.tumasterplan.cl.
      # CONSOLA_URL: de ahí sale la vuelta de Google; desplegada no se arma con la
      # cabecera Host de la petición, que la escribe quien pide.
      # CONSOLA_REPUBLICAR_AL_ARRANCAR: al arrancar, la consola republica los loteos
      # publicados cuyo visor quedó atrás (ver "Despliegue continuo" en el README).
      # CONSOLA_TRABAJOS=cloudrun y lo que sigue: a qué jobs manda los trabajos.
      - '--set-env-vars=^|^CONSOLA_ENTORNO=produccion|MASTERPLAN_DATOS=/datos|VERCEL_SCOPE=${_VERCEL_SCOPE}|MASTERPLAN_DOMINIO=${_DOMINIO}|CONSOLA_REPUBLICAR_AL_ARRANCAR=1|CONSOLA_URL=${_CONSOLA_URL}|GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID}|CIERRA_API_URL=${_CIERRA_API_URL}|CONSOLA_TRABAJOS=cloudrun|CONSOLA_GCP_PROYECTO=${PROJECT_ID}|CONSOLA_GCP_REGION=${_REGION}|CONSOLA_JOB_PESADO=${_JOB_PESADO}|CONSOLA_JOB_LIVIANO=${_JOB_LIVIANO}'

substitutions:
  _REGION: southamerica-east1
  _REPO: tumasterplan                     # repositorio de Artifact Registry
  _SERVICIO: tumasterplan-consola
  _JOB_PESADO: tumasterplan-construir     # Cloud Run Job: construir y leer planos
  _JOB_LIVIANO: tumasterplan-publicar     # Cloud Run Job: publicar en Vercel
  _BUCKET: tumasterplan-datos
  _INSTANCIA_BD: tumasterplan-bd          # Cloud SQL, la Postgres de las cuentas
  _IMAGEN: southamerica-east1-docker.pkg.dev/${PROJECT_ID}/${_REPO}/tumasterplan-consola
  _VERCEL_SCOPE: lrencoret-1882s-projects   # el equipo Pro: Hobby prohíbe el uso comercial
  _DOMINIO: tumasterplan.cl             # cada loteo en <slug>.tumasterplan.cl (comodín en Vercel)
  _CONSOLA_URL: https://consola.tumasterplan.cl   # el balanceador delante de Cloud Run
  _GOOGLE_CLIENT_ID: 910611168611-lc1d5fra9moaqoi69lbiiqll6a9tgvaf.apps.googleusercontent.com   # vacío: sin "Continuar con Google"
  _CIERRA_API_URL: https://api.cierra.cl   # vacío: sin "Conectar con Cierra"

images:
  - '${_IMAGEN}:$BUILD_ID'
  - '${_IMAGEN}:latest'

options:
  # _IMAGEN se arma con ${PROJECT_ID} y ${_REPO}: sin esto Cloud Build no expande
  # sustituciones dentro de otras, y rechaza _REPO por "no usada en la plantilla".
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
