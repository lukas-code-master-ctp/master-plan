<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Masterplan 360 — Hacienda Vichuquén</title>
<meta name="description" content="Recorre Hacienda Vichuquén desde el aire y elige tu parcela.">
<meta name="theme-color" content="#1c1a17">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="vendor/fuentes/fuentes.css">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<header class="cabecera">
  <div class="marca">
    <svg class="marca__hito" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <path d="M16 4v6M16 22v6M4 16h6M22 16h6" stroke="currentColor" stroke-width="1.6"
            stroke-linecap="round"/>
      <path d="M16 10.5 21.5 16 16 21.5 10.5 16Z" fill="currentColor"/>
    </svg>
    <h1 class="marca__texto">
      <span class="marca__nombre" id="marca-nombre">Hacienda Vichuquén</span>
      <span class="marca__meta">
        <span id="marca-etapa"></span>
        <span class="marca__coord">34°47′S · 72°00′O</span>
      </span>
    </h1>
  </div>

  <div class="cabecera__herramientas">
    <div class="buscador">
      <svg class="buscador__lupa" viewBox="0 0 16 16" aria-hidden="true">
        <circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <path d="M10.5 10.5 L14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <label class="visually-hidden" for="buscador">Buscar parcela</label>
      <input id="buscador" type="search" placeholder="Buscar parcela" autocomplete="off"
             spellcheck="false" enterkeyhint="search">
      <ul id="sugerencias" class="sugerencias" role="listbox" hidden></ul>
    </div>

    <button id="abrir-filtros" class="pastillon" aria-expanded="false" aria-controls="filtros">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path d="M2 4h12M4.5 8h7M7 12h2" stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round"/>
      </svg>
      <span>Filtros</span>
      <span id="filtros-activos" class="cuenta" hidden></span>
    </button>
  </div>
</header>

<section id="filtros" class="filtros" hidden>
  <fieldset class="filtros__grupo">
    <legend>Estado</legend>
    <div id="filtro-estados" class="chips"></div>
  </fieldset>

  <fieldset class="filtros__grupo">
    <legend>Superficie</legend>
    <div class="rango">
      <label>Desde <input id="sup-min" type="number" step="100" inputmode="numeric"
                          placeholder="5.000"> <i>m²</i></label>
      <label>Hasta <input id="sup-max" type="number" step="100" inputmode="numeric"
                          placeholder="13.200"> <i>m²</i></label>
    </div>
  </fieldset>

  <fieldset class="filtros__grupo">
    <legend>Vista aérea</legend>
    <label class="interruptor">
      <input id="solo-con-vista" type="checkbox">
      <span>Solo parcelas visibles desde el aire</span>
    </label>
  </fieldset>

  <div class="filtros__pie">
    <span id="conteo-filtros" class="conteo"></span>
    <button id="limpiar-filtros" class="boton boton--texto">Limpiar</button>
  </div>
</section>

<main class="escena">

  <section id="visor" class="visor" aria-label="Vista aérea 360">
    <canvas id="lienzo-360"></canvas>
    <svg id="overlay" class="overlay" xmlns="http://www.w3.org/2000/svg"
         aria-label="Parcelas sobre la vista aérea"></svg>

    <div id="cargando" class="cargando" hidden>
      <span id="cargando-texto">Cargando vista</span>
      <span class="cargando__hilo"><i></i></span>
    </div>

    <div id="error-carga" class="aviso-error" hidden></div>
  </section>

  <!-- Columna de instrumentos -->
  <div class="instrumentos">
    <div class="rosa" id="brujula" aria-hidden="true">
      <svg viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="46" class="rosa__anillo"/>
        <g id="brujula-aguja">
          <g class="rosa__ticks">
            <line x1="93" y1="50" x2="85" y2="50"/>
            <line x1="50" y1="93" x2="50" y2="85"/>
            <line x1="7" y1="50" x2="15" y2="50"/>
          </g>
          <path class="rosa__norte" d="M50 29 L57 55 L50 50 L43 55 Z"/>
          <path class="rosa__sur" d="M50 79 L43 50 L50 55 L57 50 Z"/>
          <text class="rosa__letra" x="50" y="23">N</text>
        </g>
        <circle cx="50" cy="50" r="2.5" class="rosa__centro"/>
      </svg>
    </div>

    <div class="altimetro" role="group" aria-label="Altura de vuelo">
      <span class="altimetro__unidad">altura</span>
      <div id="controles-altura" class="altimetro__escala"></div>
      <span class="altimetro__unidad altimetro__unidad--pie">metros</span>
    </div>

    <div class="zoom" role="group" aria-label="Acercar y alejar">
      <button id="acercar" type="button" aria-label="Acercar">+</button>
      <button id="alejar" type="button" aria-label="Alejar">−</button>
    </div>
  </div>

  <!-- Controles inferiores -->
  <div class="barra-inferior">
    <div class="acciones-rapidas">
      <button id="accion-compartir" class="accion" type="button">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M13 7V4.5L18 10l-5 5.5V13c-4 0-6.5 1-8 3 .5-4.5 3-8.5 8-9Z"
                fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
        <span class="accion__texto">Compartir</span>
      </button>
      <button id="accion-plano" class="accion" type="button">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M10 18s6-5.3 6-10a6 6 0 1 0-12 0c0 4.7 6 10 6 10Z" fill="none"
                stroke="currentColor" stroke-width="1.5"/>
          <circle cx="10" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.5"/>
        </svg>
        <span class="accion__texto">Plano</span>
      </button>
      <a id="accion-whatsapp" class="accion accion--whatsapp" target="_blank" rel="noopener">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M3 17l1-3.4A7 7 0 1 1 6.6 16L3 17Z" fill="none" stroke="currentColor"
                stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M7.4 7.6c0 3 2 5 5 5 .6 0 1-.5 1-1l-1.4-.7-.8.8a5 5 0 0 1-2-2l.8-.8L9.3 7
                   c-.5 0-1 .2-1.4.4a1 1 0 0 0-.5.9Z" fill="currentColor"/>
        </svg>
        <span class="accion__texto">WhatsApp</span>
      </a>
    </div>

    <div class="puntos" role="group" aria-label="Punto de vuelo">
      <span class="puntos__rotulo">Punto</span>
      <div id="controles-posicion" class="puntos__fila"></div>
    </div>
  </div>

  <div id="leyenda" class="leyenda"></div>

  <p class="pista" id="pista">Arrastra para mirar · rueda para acercar</p>

  <!-- Plano -->
  <section id="carta" class="carta">
    <header class="carta__barra">
      <span class="carta__titulo">Plano del loteo</span>
      <button id="ampliar-mapa" class="carta__accion" aria-pressed="false">
        <span class="visually-hidden">Ampliar el plano</span>
        <svg viewBox="0 0 14 14" aria-hidden="true">
          <path d="M1 5V1h4M13 9v4H9M9 1h4v4M5 13H1V9" fill="none"
                stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </header>
    <div id="mapa" class="mapa" aria-label="Plano del loteo"></div>
  </section>

  <div class="conmutador" role="tablist">
    <button class="pestana pestana--activa" role="tab" data-panel="visor"
            aria-selected="true">Vista aérea</button>
    <button class="pestana" role="tab" data-panel="mapa" aria-selected="false">Plano</button>
  </div>

  <aside id="ficha" class="ficha" aria-live="polite" hidden></aside>

</main>

<script src="vendor/leaflet.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
